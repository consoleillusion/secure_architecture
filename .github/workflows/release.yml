name: Build and Release PDF
on:
  push:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Typst
        run: |
          curl -fsSL \
            https://github.com/typst/typst/releases/download/v0.15.0/typst-x86_64-unknown-linux-musl.tar.xz \
            -o typst.tar.xz

          tar -xJf typst.tar.xz
          sudo install typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version
      - name: Compile PDF
        run: ./compile.sh
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            secure_architecture.pdf \
            --target "$GITHUB_SHA" \
            --title "Build #${GITHUB_RUN_NUMBER}" \
            --notes "Automatically generated from commit ${GITHUB_SHA}."

