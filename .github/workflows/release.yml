name: Build and Release PDF
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Typst
        run: |
          curl -fsSL \
            https://github.com/typst/typst/releases/download/v0.15.0/typst-x86_64-unknown-linux-musl.tar.xz \
            -o typst.tar.xz

          tar -xJf typst.tar.xz
          sudo install typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version
      - name: Compile PDF
        run: ./compile.sh
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSET="secure_architecture-${TAG}.pdf"

          cp secure_architecture.pdf "$ASSET"

          gh release create "$TAG" \
            "$ASSET" \
            --title "$TAG" \
            --notes "Release $TAG"
